name: Build APK and publish GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Releases phải dùng đúng keystore đã ký các bản APK trước đó.
      # Lưu keystore dạng Base64 và thông tin ký trong GitHub Actions Secrets.
      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
          test -s app/release-key.jks
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/release-key.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing signing secrets: ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            exit 1
          fi
          gradle :app:assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PgithubRepo=${{ github.repository }} \
            --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/MHD-Sports.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHD-Sports-${{ github.run_number }}
          path: app/build/outputs/apk/release/MHD-Sports.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MHD Sports build ${{ github.run_number }}
          body: |
            Bản phát hành tự động từ commit `${{ github.sha }}`.
            VersionCode: `${{ github.run_number }}`
          make_latest: true
          files: app/build/outputs/apk/release/MHD-Sports.apk
