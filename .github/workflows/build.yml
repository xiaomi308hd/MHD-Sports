name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialize releases so two runs cannot publish the same calculated version.
concurrency:
  group: mhd-sports-production-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Calculate next versionCode
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          current = 0
          try:
              current = int(json.loads(Path("version.json").read_text(encoding="utf-8")).get("versionCode", 0))
          except Exception:
              pass
          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          # The result is always newer than the last published build 147 and run number.
          next_code = max(current, run_number, 141) + 1
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"VERSION_CODE={next_code}\n")
              env.write(f"VERSION_NAME=1.{next_code}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version_code={next_code}\n")
              output.write(f"version_name=1.{next_code}\n")
          print(f"Previous versionCode={current}; workflow run={run_number}; next={next_code}")
          PYCODE

      - name: Decode and validate production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing secret KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing secret KEYSTORE_PASSWORD"; exit 1; }
          test "$KEY_ALIAS" = "sportsplayer" || { echo "::error::KEY_ALIAS must be sportsplayer"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > sportsplayer.jks
          test -s sportsplayer.jks
          keytool -list -keystore sportsplayer.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          echo "Original production keystore and sportsplayer alias verified."

      - name: Build production Release APK
        env:
          ANDROID_KEYSTORE_FILE: sportsplayer.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing secret KEY_PASSWORD"; exit 1; }
          gradle :app:assembleRelease -PversionCode="$VERSION_CODE" --no-daemon

      - name: Verify APK package, version and signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > badging.txt
          grep -F "package: name='com.mhd.sports' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" badging.txt
          echo "APK verification passed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHDSports-apk-${{ steps.version.outputs.version_code }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.version.outputs.version_code }}
          name: MHD Sports ${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})
          body: |
            ${{ github.event.head_commit.message || 'Manual production build' }}

            - Package: com.mhd.sports
            - versionCode: ${{ steps.version.outputs.version_code }}
            - Signed with the original production sportsplayer keystore.
          make_latest: true
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

      - name: Generate version.json
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_NOTE: ${{ github.event.head_commit.message || 'MHD Sports update' }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          code = int(os.environ["VERSION_CODE"])
          data = {
              "applicationId": "com.mhd.sports",
              "versionCode": code,
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": f"https://github.com/{os.environ['REPOSITORY']}/releases/download/build-{code}/app-release.apk",
              "notes": os.environ.get("RELEASE_NOTE", "MHD Sports update").splitlines()[0][:300]
          }
          Path("version.json").write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PYCODE

      - name: Commit version.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update version.json to $VERSION_NAME [skip ci]"
          git push origin HEAD:main

      - name: Remove signing keystore
        if: always()
        run: rm -f sportsplayer.jks
